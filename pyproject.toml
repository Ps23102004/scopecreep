[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scopecreep"
version = "0.1.0"
description = "Does this PR's diff actually match its stated title? A local-model second opinion."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests",
    "pyyaml",
    "llm-ladder",
    "typer",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
scopecreep = "scopecreep.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["scopecreep"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "web"
"chains.yaml" = "chains.yaml"

[tool.hatch.build.targets.sdist]
include = [
    "scopecreep/*",
    "web/*",
    "chains.yaml",
]

[tool.hatch.build]
include = [
    "scopecreep/*",
    "web/*",
    "chains.yaml",
]

[tool.pytest.ini_options]
markers = ["network: hits a live external API"]
